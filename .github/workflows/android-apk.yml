name: Build SmartMic Android APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/smartmic-tools
          curl -fLsS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/smartmic-tools.zip
          unzip -q /tmp/smartmic-tools.zip -d /tmp/smartmic-tools
          rm -rf "$ANDROID_HOME/cmdline-tools/smartmic"
          mv /tmp/smartmic-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/smartmic"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/smartmic/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartMic-TF220-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
